### ------------------------ 深度学习任务配置 ------------------------ ###
# 使用Step0生成的数据划分的数据，在split_info文件夹
train_file: G:\Wang zhong yi_deep learning radiomics\深度学习影像组学预测ccRCC\模型构建与验证\train.txt
val_file: G:\Wang zhong yi_deep learning radiomics\深度学习影像组学预测ccRCC\模型构建与验证\val.txt
# 自己数据存放的目录。一般是由OKT-crop_max_ro工具生成。
data_pattern: G:\Wang zhong yi_deep learning radiomics\深度学习影像组学预测ccRCC\模型构建与验证\crop
# 你选择的模型名称
# | **模型系列** | **模型名称**                                                   |
# | ------------ | ------------------------------------------------------------ |
# | AlexNet      | alexnet                                                      |
# | VGG          | vgg11, vgg11_bn, vgg13, vgg13_bn, vgg16, vgg16_bn, vgg19_bn, vgg19 |
# | ResNet       | resnet18, resnet34, resnet50, resnet101, resnet152, resnext50_32x4d, resnext101_32x8d, wide_resnet50_2, wide_resnet101_2 |
# | DenseNet     | densenet121, densenet169, densenet201, densenet161           |
# | Inception    | googlenet, inception_v3                                      |
# | SqueezeNet   | squeezenet1_0, squeezenet1_1                                 |
# | ShuffleNetV2 | shufflenet_v2_x2_0, shufflenet_v2_x0_5, shufflenet_v2_x1_0, shufflenet_v2_x1_5 |
# | MobileNet    | mobilenet_v2, mobilenet_v3_large, mobilenet_v3_small         |
# | MNASNet      | mnasnet0_5, mnasnet0_75, mnasnet1_0, mnasnet1_3              |
# | ViT          | ViT, SimpleViT, Crossformer, TwinsSVT|
model_name: resnet18
# 这个不用动，模型存放的位置
model_root: dl_models
epoch: 30

### ------------------------ 传统组学任务配置 ------------------------ ###
# 影像数据存放位置，需要确保该目录下存在images和masks文件夹。
radio_dir: G:\Wang zhong yi_deep learning radiomics\深度学习影像组学预测ccRCC\模型构建与验证
task_column: label
# label文件位置，注意这里需要是多中心的配置，包括group信息。
label_file: G:\Wang zhong yi_deep learning radiomics\深度学习影像组学预测ccRCC\模型构建与验证\label.csv
dataset_column: group

# 特征提取的配置文件位置
extractor_settings: 
# 使用MRMR模型筛选特征, 不输入数据的时候，不使用mRMR，默认不使用
mrmr_sel_feature_num: 
ml_models:
  - LR
  - SVM
  - KNN
  - RandomForest
  - ExtraTrees
  - XGBoost
  - LightGBM
  - MLP

### ------------------------ 传统组学+深度学习任务配置 ------------------------ ###
# 使用ctl c+ ctl v拼接之后的特征文件
combined_feature_file: C:\Users\Administrator\Desktop\resnet18_组件\features\resnet18_compress_features.csv
dl_feature_file: 
rad_feature_file: 

### ------------------------ 临床任务配置 ------------------------ ###
clinic_file: G:\Wang zhong yi_deep learning radiomics\深度学习影像组学预测ccRCC\模型构建与验证\clinic.csv
# 用于做临床特征筛选的pvalue
p_value: 0.05


### ------------------------ 汇总任务配置 ------------------------ ###
# ROC、校准、DCA、Delong汇总对比的模型。
summary_models: [RS, DLS]
# 使用什么模型与临床特征进行融合，得到最终的Nomogram
fusion_models: [RS, DLS]
sel_model: 
  RS: RandomForest
  DLS: AdaBoost
  Clinic: KNN
  
subsets: [train, test]
font.size: 12
display.precision: 3
DISABLE_VIDEO: True
